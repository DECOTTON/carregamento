<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carregamento</title>
<meta name="theme-color" content="#061637">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carregamento">
<style>
:root{--ink:#0F1B1A;--mut:#3E4A48;--bg:#EEF1F0;--card:#fff;--line:#C9D1CF;--acc:#061637;--acc2:#4DA4D9;--ok:#1E8E3E;--bad:#C62828;--warn:#B26A00;--warnbg:#FFF2D6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer}
header{flex-wrap:wrap;position:sticky;top:0;z-index:5;background:var(--acc);color:#fff;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
header h1{font-size:19px;margin:0;flex:1;display:flex;flex-wrap:wrap;align-items:center;column-gap:8px}header h1 small{flex:1 1 100%}.hlogo{width:30px;height:30px;border-radius:7px;background:#fff}
header small{display:block;font-size:12px;opacity:.85;font-weight:500}
.hb{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:7px 10px;font-size:14px;font-weight:700}
main{padding:12px;max-width:640px;margin:0 auto;padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.card h2{font-size:14px;letter-spacing:.04em;text-transform:uppercase;margin:0 0 8px;color:var(--acc)}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:12px 14px;font-weight:700;font-size:16px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.big{width:100%;padding:16px;font-size:18px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 auto}
.scan{width:100%;font:700 20px/1.2 ui-monospace,Menlo,monospace;padding:14px;border:3px solid var(--acc);border-radius:12px;color:var(--ink);background:#fff;-webkit-text-fill-color:var(--ink)}
.scan::placeholder{font:500 15px system-ui,sans-serif;color:#6B7774;-webkit-text-fill-color:#6B7774}
.hint{font-size:13px;color:var(--mut);margin:6px 0 0}
.muted{color:var(--mut)}
.lst{list-style:none;margin:0;padding:0}.lst li{border-top:1px solid var(--line);padding:9px 2px;display:flex;gap:8px;align-items:center}.lst li:first-child{border-top:0}
.lst li b{font-size:17px}.lst li .r{margin-left:auto;text-align:right}
.pill{display:inline-block;font-weight:800;background:#EEF1F0;border:1px solid var(--line);border-radius:6px;padding:1px 8px}
.flash{border-radius:12px;padding:12px;text-align:center;font-weight:800;font-size:18px;margin:10px 0;min-height:52px;display:flex;align-items:center;justify-content:center}
.flash.ok{background:#DDF3E3;color:#14552A}.flash.dup{background:var(--warnbg);color:#6B4100}.flash.idle{background:#EEF1F0;color:var(--mut);font-weight:600;font-size:15px}
.flash.done{background:var(--ok);color:#fff;font-size:22px}
.lock{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;color:#fff;gap:14px}
.lock.bad{background:var(--bad)}.lock.warn{background:#8A5300}
.lock h3{font-size:30px;margin:0;line-height:1.1}.lock p{font-size:19px;margin:0;max-width:520px}.lock .lt{font:900 54px/1 system-ui,sans-serif;background:#fff;color:var(--bad);border-radius:10px;padding:4px 16px}
.lock.warn .lt{color:#8A5300}
.lock .btn{background:#fff;color:var(--ink);border:0;font-size:19px;padding:16px 22px;max-width:420px;width:100%}
.ovl{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 10px;font-size:19px}
.cam{position:fixed;inset:0;z-index:45;background:#000;display:flex;flex-direction:column}
.cam video{flex:1;width:100%;object-fit:cover}
.cam .cbar{display:flex;gap:8px;padding:10px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:#111}
.cam .tgt{position:absolute;left:8%;right:8%;top:30%;height:26%;border:3px solid rgba(255,255,255,.85);border-radius:12px;pointer-events:none}
.cam .vw{position:relative;flex:1;min-height:0;overflow:hidden}.cam .vw video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .pfr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.cam .pbox{width:92%;aspect-ratio:4/3;border:3px solid #F2C230;border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.55);position:relative}
.cam .pbox span{position:absolute;top:-26px;left:0;right:0;text-align:center;color:#F2C230;font-weight:800;font-size:14px}
.cam .cmsg{position:absolute;left:0;right:0;top:12px;text-align:center;color:#fff;font-weight:700;text-shadow:0 1px 3px #000}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1D2E2C;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-weight:600;max-width:90vw;text-align:center}
.tag{font-size:12px;font-weight:700;border-radius:5px;padding:1px 6px}.tag.ok{background:#DDF3E3;color:#14552A}.tag.warn{background:var(--warnbg);color:#6B4100}.tag.blue{background:#E1ECF7;color:#123E66}
.sbar{flex:1 1 100%;display:flex;gap:6px;margin-top:4px}.sbar .scan{flex:1;min-width:0;padding:10px 12px;font-size:19px;border:2px solid #F2C230}
.sb{border:0;border-radius:10px;padding:0 12px;font-weight:800;font-size:16px;background:#fff;color:var(--ink)}.sb.pri{background:#F2C230}
/* placa no padrão Mercosul */
.placa{display:inline-flex;flex-direction:column;align-items:stretch;border:3px solid #1D2E2C;border-radius:8px;background:#fff;overflow:hidden;min-width:200px}
.placa i{display:block;background:#123E99;color:#fff;font:700 10px/1.6 system-ui,sans-serif;letter-spacing:.12em;text-align:center;font-style:normal}
.placa b{display:block;font:900 40px/1.1 ui-monospace,Menlo,monospace;letter-spacing:.06em;text-align:center;padding:2px 12px 4px;color:#0F1B1A}
.placa.sm{min-width:0}.placa.sm b{font-size:24px;padding:0 8px 2px}.placa.sm i{font-size:8px}
.sec .sech{display:flex;align-items:center;width:100%;background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer;color:inherit}.sec .sech h2{flex:1;margin:0}.sec .chev{font-size:20px;color:var(--acc);transition:transform .15s;transform:rotate(-90deg)}.sec.open .chev{transform:none}.sec .secb{display:none;margin-top:10px}.sec.open .secb{display:block}.sec.pend{border-color:#F2C230;background:#FFFBEA}
.pbar{display:flex;align-items:center;width:100%;border:1px solid #F2C230;background:#FFF3C4;color:#6B4100;font:800 16px/1.2 system-ui,sans-serif;border-radius:10px;padding:10px 12px;margin:0 0 12px;text-align:left}.pbar span{margin-left:auto;font-size:22px}
.osrch{position:relative;margin:0 0 10px}.osrch input{width:100%;font:700 18px/1.2 system-ui,sans-serif;padding:12px 44px 12px 12px;border:2px solid var(--line);border-radius:10px;text-transform:uppercase}.osrch input::placeholder{text-transform:none;font-weight:500}.osrch input:focus{outline:none;border-color:var(--acc)}.osrch button{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:20px;padding:8px 10px;color:var(--mut)}
.ord{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:12px;background:#fff;padding:12px;margin-bottom:10px;color:var(--ink)}
.ord .oh{display:flex;align-items:center;gap:12px}.ord .oi{flex:1;min-width:0}.ord .on{font:800 20px/1.1 system-ui,sans-serif}.ord .os{font-size:14px;color:var(--mut);margin-top:2px}
.ord .olst{margin-top:8px;border-top:1px solid var(--line)}.ord .olst>div{display:flex;justify-content:space-between;align-items:baseline;padding:5px 2px;border-bottom:1px solid var(--line);font-size:16px}
.ord .olt b{font:900 20px/1 system-ui,sans-serif}.ord .olq{font:800 18px/1 system-ui,sans-serif;white-space:nowrap}.ord .olst>div.oltot{border-bottom:0;font-size:14px;color:var(--mut);font-weight:700}.ord.run{border-left-color:#F2C230;background:#FFFBEA}
.itab{width:100%;border-collapse:collapse;margin-top:6px}.itab th{font-size:11px;color:var(--mut);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);text-transform:uppercase}
.itab td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}.itab td.q{text-align:right;font:900 22px/1 system-ui,sans-serif;white-space:nowrap}.itab td.q small{font-size:13px;font-weight:700;color:var(--mut)}
.itab td.lt{font:900 24px/1 system-ui,sans-serif}.itab tr.ok td{background:#E3F4E8}.itab tr.hl td{background:#FFF6D6}
.itab .bar{height:8px;margin-top:5px}
.bar{height:14px;background:#DDE3E1;border-radius:7px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);transition:width .2s}
.cnt{font:900 58px/1 system-ui,sans-serif;text-align:center;margin:6px 0 2px}.cnt small{font-size:26px;color:var(--mut);font-weight:800}
.foto{display:flex;gap:10px;align-items:center;margin-top:8px}.foto img{width:128px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#EEF1F0}
.foto .fi{flex:1;font-size:14px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:12px;border:2px solid var(--line);border-radius:10px;margin-top:10px;font-size:16px;font-weight:600}.chk input{width:24px;height:24px;flex:none;margin:0}
.chk.on{border-color:var(--ok);background:#E3F4E8}
.fld{display:block;margin-top:10px}.fld span{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:3px}
.fld input,.fld textarea,.fld select{width:100%;font-size:17px;padding:10px;border:1px solid var(--line);border-radius:10px;color:var(--ink);background:#fff;font-family:inherit}
.sbad{margin-top:10px;padding:10px;border-radius:8px;background:#FDECEA;color:#8A1C12;font-weight:600}
.sok{margin-top:10px;padding:10px;border-radius:8px;background:#E3F4E8;color:#14552A;font-weight:600}
.hide{display:none!important}
.locb{display:flex;align-items:center;gap:6px;width:100%;margin:5px 0 2px;border:1px solid #B9C7DD;background:#EEF3FA;color:#0F2A55;border-radius:8px;padding:7px 9px;font:800 14px/1.15 system-ui,sans-serif;text-align:left}
.locb span{margin-left:auto;font-weight:700;font-size:12px;color:var(--acc);white-space:nowrap}.locb.nf{background:#F3F3F3;border-color:var(--line);color:var(--mut);font-weight:600}.locb:disabled{opacity:1}
/* mapa do pátio (mesmo visual do mapa do app principal) */
body.mvon{overflow:hidden}
.mapv{position:fixed;inset:0;z-index:30;background:#E6E9E7;display:flex;flex-direction:column;--mfloor:#D5DAD6;--maisle:#E3B53B;--mink:#1D2E2C}
.mvh{background:var(--acc);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
.mvh h1{margin:0;font-size:19px;line-height:1.15;flex:1;min-width:0}.mvh h1 small{display:block;font-size:12px;font-weight:500;opacity:.85}
.mvbar{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.mvq{position:relative;flex:1}
.mvq input{width:100%;font:700 17px/1.2 system-ui,sans-serif;padding:10px 36px 10px 12px;border:2px solid var(--line);border-radius:10px;box-sizing:border-box}
.mvq input:focus{outline:none;border-color:var(--acc)}
.mvq button{position:absolute;right:2px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:18px;padding:6px 8px;color:var(--mut)}
.mvhl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px;background:#FFF6D6;border-bottom:1px solid #F2C230;font-size:14px}
.mvhl button{border:1px solid #E0B94F;background:#fff;border-radius:8px;padding:4px 9px;font:800 15px/1.15 system-ui;color:var(--ink);text-align:left}
.mvhl button small{display:block;font-weight:600;font-size:11px;color:var(--mut)}
.mvhl button.nf{opacity:.6}.mvhl .nf{color:var(--bad);font-weight:700}.mvhl .x{margin-left:auto;border:0;background:none;font-size:18px}
.mvleg{display:flex;flex-wrap:wrap;gap:4px 12px;padding:7px 12px;background:var(--card);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--mut)}
.mvleg span{display:inline-flex;align-items:center;gap:5px}.mvleg i{width:14px;height:14px;border-radius:2px;display:inline-block;border:1px solid rgba(0,0,0,.2)}
.mvleg i.lf{background:#fff}.mvleg i.lb{background:repeating-linear-gradient(45deg,rgba(163,59,43,.35) 0 3px,transparent 3px 6px);border-color:#A33B2B}.mvleg i.lm{background:repeating-linear-gradient(135deg,#B9824A 0 4px,#A8743F 4px 8px);border-color:#6D4520}
.mvbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px 10px max(14px,env(safe-area-inset-bottom))}
.mvpat{background:var(--mfloor);border-radius:6px;padding:10px;margin:0 0 12px}
.mvph{display:flex;align-items:center;gap:10px}.mvph b{font-size:19px;color:var(--mink)}
.mvcar{width:36px;height:36px;border:1px solid var(--line);background:#fff;border-radius:6px;font-size:16px;color:var(--mink);flex:none}
.mvz{display:flex;margin:10px 0 0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.mvz>*{flex:1 1 0;min-width:0;border:0;border-right:1px solid var(--line);background:#fff;font:600 14px/1 system-ui;color:var(--mink);padding:11px 2px;text-align:center}.mvz>*:last-child{border-right:0}
.mvz [data-zf]{flex:1.6 1 0}.mvz [data-fs],.mvz [data-rot]{font-size:17px}.mvz .on{background:var(--acc);color:#fff}
.mvst{margin:8px 0 6px;font-size:13.5px;color:#3E4A48}.mvst b{color:#1E7D3A}
.mvwrap{overflow:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px 4px}
.mvg{display:grid;gap:0;width:max-content}
.mvcell{padding:2px;box-sizing:border-box;min-width:0;min-height:0}
.mvrl{display:flex;align-items:center;justify-content:center;font:700 12px/1 "Barlow Condensed","Arial Narrow",system-ui,sans-serif;color:var(--mink)}
.mvrua{position:relative;background:#F7F7F4;border-top:2px solid var(--maisle);border-bottom:2px solid var(--maisle);box-sizing:border-box;display:flex;align-items:center;justify-content:center;margin:2px 0}
.mvrua::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed var(--maisle)}
.mvrua span{position:relative;background:#F7F7F4;padding:0 8px;font:800 10px/1 system-ui,sans-serif;letter-spacing:.12em;color:var(--mink)}
.mvtv{position:relative;background:#F7F7F4;border-left:2px solid var(--maisle);border-right:2px solid var(--maisle);box-sizing:border-box;margin:0 2px}
.mvtv::before{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:2px dashed var(--maisle)}

.mapv .mlc{position:relative;width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:4px 5px 5px;border:1px solid rgba(0,0,0,.15);border-radius:6px;background:#F4F1EA;color:#1D2E2C;text-align:left;font-family:system-ui,sans-serif;overflow:hidden;min-width:0}
.mapv .mlc>*{flex-shrink:0}
.mapv .mlc .mlx{font-size:10px;font-weight:800;opacity:.75;line-height:1.1}
.mapv .mlc b{font:800 18px/1.05 "Barlow Condensed","Arial Narrow",system-ui,sans-serif;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mapv .mlc small{font-size:9px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85;line-height:1.2}
.mapv .mlc i{font-style:normal;font-size:10px;font-weight:700;line-height:1.2}
.mapv .mlc .mlsr{margin-top:auto;display:flex;gap:3px;max-width:100%;min-width:0}
.mapv .mlc .mls{font-size:7.5px;font-weight:800;padding:1px 3px;border-radius:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.35}
.mapv .mlc .mls.mlw{flex:none;padding:0 2px;font-size:8px}
.mapv .mlc .mlp{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%}.mapv .mlp.pk{background:#C62828}.mapv .mlp.fc{background:#2E9E4F}
.mapv .mlc.free{background:transparent;border:1px dashed #9AA6A2;color:#5E6B69}.mapv .mlc.free .mlv{color:#2E9E4F;font-size:16px}
.mapv .mlc.blk{background:repeating-linear-gradient(135deg,#E6E2D8 0 6px,#D8D3C7 6px 12px);color:#555}.mapv .mlc.blk .mlv{font-size:12px;white-space:normal;text-transform:uppercase}
.mapv .mlc.matb{background:#E8D3B5}.mapv .mlc.matb b{font-size:13px}
.mapv .mlc.mix{background:repeating-linear-gradient(135deg,#EFE6D2 0 8px,#E6DBC2 8px 16px);border:1px solid #8D6E63}.mapv .mlc.mix b{font-size:12.5px;letter-spacing:-.01em}
.mapv .mlc.dim{opacity:.22}
.mapv .mlc.hit{outline:3px solid #F9A825;outline-offset:-1px;z-index:2;opacity:1}
.mapv .mlc.loc{box-shadow:inset 0 0 0 3px var(--acc)}
.mvest{width:100%;height:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;text-align:center;background:#4A5553;border:3px solid #F2C230;border-radius:4px;color:#fff;padding:2px;overflow:hidden}
.mvest span{font:700 13px/1.05 "Barlow Condensed","Arial Narrow",system-ui,sans-serif;letter-spacing:.04em;text-transform:uppercase;overflow-wrap:anywhere}
.mvest.hyd{background:#C62828}.mvest.dim{opacity:.22}
.mvpulse{animation:mvp 1s ease-in-out 3}@keyframes mvp{50%{transform:scale(1.08)}}
.mvchips{display:flex;gap:8px;overflow-x:auto;padding:8px 10px 2px;background:var(--card);-webkit-overflow-scrolling:touch;scrollbar-width:none}.mvchips::-webkit-scrollbar{display:none}
.mvchips button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font:600 15px/1 system-ui,sans-serif;color:var(--ink);white-space:nowrap}
.mvtool{display:flex;gap:8px;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.mvtool button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 10px;font:600 15px/1 system-ui,sans-serif;color:var(--ink)}
.mvbody.fsm{padding:6px}.mvpat.fs{margin:0;min-height:100%;box-sizing:border-box;display:flex;flex-direction:column}.mvpat.fs .mvwrap{flex:1}
.mvpat.fs.rot{position:fixed;top:0;left:100vw;width:100vh;width:100dvh;height:100vw;transform-origin:0 0;transform:rotate(90deg);z-index:35;border-radius:0;overflow:hidden}
.mvpat.fs.rot .mvwrap{overflow:auto}
.mapv.fsmode .mvbar,.mapv.fsmode .mvchips,.mapv.fsmode .mvtool,.mapv.fsmode .mvhl{display:none}
/* menu (padrão dos apps do coletor) */
.mnu{display:flex;flex-direction:column;gap:2px;margin:0 0 8px}
.mng{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:12px 2px 4px}.mng:first-child{margin-top:0}
.mni{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;margin:0 0 6px;font:inherit;color:var(--ink);min-height:56px}
.mni:active{background:#EEF1F0}
.mni .ic{flex:none;width:36px;height:36px;border-radius:10px;background:#E7ECF5;color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:19px}
.mni .tx{flex:1;min-width:0;display:flex;flex-direction:column}.mni .tx b{font-size:16.5px;line-height:1.2}.mni .tx small{font-size:12.5px;color:var(--mut);margin-top:2px;line-height:1.3}
.mni .ch{flex:none;color:var(--mut);font-size:22px;line-height:1}
.mni .bd{flex:none;background:#FFF2D6;color:#8A5A00;border:1px solid #F2C230;border-radius:999px;padding:2px 9px;font-size:13px;font-weight:800}
.mni.dg .ic{background:#FDECEC;color:var(--bad)}.mni.dg .tx b{color:var(--bad)}
.mnv{text-align:center;font-size:12px;color:var(--mut);margin:6px 0 10px}
.devrow{display:flex;align-items:center;gap:10px;margin:6px 0 4px}.devrow span{font:900 24px/1 system-ui,sans-serif;letter-spacing:.04em;color:var(--acc)}
.devrow input{flex:1;min-width:0;font:900 28px/1 system-ui,sans-serif;padding:10px 12px;border:2px solid var(--line);border-radius:10px;text-align:center}
.devrow input:focus{outline:none;border-color:var(--acc)}
.devpv{margin:4px 0 12px;text-align:center;font-size:14px;color:var(--mut);font-weight:700}
</style>
</head>
<body>
<header><h1><img src="logo.png" alt="" class="hlogo">Carregamento<small id="hSub">Sem pacote carregado</small></h1><button class="hb" id="bMenu" type="button">☰ Menu</button>
<div id="sbar" class="sbar hide"><input class="scan" id="scan" autocomplete="off" autocorrect="off" spellcheck="false" inputmode="numeric" enterkeyhint="go" placeholder="Etiqueta SAI ou Nº do fardo"><button class="sb" id="bGo" type="button">OK</button><button class="sb pri" id="bCam" type="button" title="Câmera">📷</button></div></header>
<main id="app"></main>
<input type="file" id="fPac" accept=".txt,.json,text/plain,application/json" hidden>
<input type="file" id="fFoto" accept="image/*" capture="environment" hidden>
<script>
"use strict";
// ======================================================================
// App offline de carregamento (expedição) — coletor / celular
// Carrega o "pacote" gerado no app principal (com as ordens de carregamento),
// confere a placa (foto), lê cada fardo e confere lote e quantidade pedida,
// e devolve as cargas (leituras + fotos) em arquivo.
// A comunicação direta com o ERP (API) entra depois, no lugar do arquivo.
// ======================================================================
const VER="1.1.8";
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>n==null?"—":Number(n).toLocaleString("pt-BR");
const g3=v=>String(v).replace(/\B(?=(\d{3})+(?!\d))/g," ");
const nowISO=()=>new Date().toISOString();
const uid=()=>"c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const dtf=t=>t?new Date(t).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}):"—";
function toast(t,ms){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),ms||2600)}
const placaFmt=p=>{const t=String(p||"").toUpperCase().replace(/[^0-9A-Z]/g,"");return t.length===7?t.slice(0,3)+(/[A-Z]/.test(t[4])?"":"-")+t.slice(3):t||"—"};
const placaHTML=(p,sm)=>`<span class="placa${sm?" sm":""}"><i>BRASIL</i><b>${esc(placaFmt(p))}</b></span>`;

// ---------- armazenamento no aparelho (IndexedDB) ----------
const DB={db:null,
  open(){return this.db?Promise.resolve(this.db):new Promise((ok,ko)=>{const r=indexedDB.open("carregamento",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>{this.db=r.result;ok(this.db)};r.onerror=()=>ko(r.error)})},
  async get(k){const db=await this.open();return new Promise((ok,ko)=>{const q=db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ko(q.error)})},
  async set(k,v){const db=await this.open();return new Promise((ok,ko)=>{const t=db.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=()=>ok();t.onerror=()=>ko(t.error)})}};

// ---------- estado ----------
let PAC=null;          // pacote cru
let IX=null;           // índices do pacote
let S={cargas:[],atual:null,disp:"",conf:""};  // cargas deste aparelho (persistidas)
let ui={view:"home",oid:null,lock:null,flash:null,prep:null,q:""};
async function saveState(){try{await DB.set("estado",S)}catch(e){toast("Não foi possível salvar no aparelho!")}}

function buildIndex(P){
  const f=new Map(),byN=new Map();const F=P.f,st=P.fs||3;
  for(let i=0;i<F.length;i+=st){const p=F[i],n=F[i+1];f.set(p*1e7+n,i);const a=byN.get(n);if(a)a.push(p);else byN.set(n,[p])}
  const lotes=new Map();for(const[c,prod,qtd,exp,expd,bx,dexp,cli]of P.lotes||[])lotes.set(String(c),{c:String(c),prod,qtd,exp,expd:!!expd,dexp:dexp||"",cli:cli||""});
  const cexp=new Map();for(const x of P.cexp||[]){if(Array.isArray(x))cexp.set(x[0],x[1]||"");else cexp.set(String(x),"")}
  return{f,byN,lotes,st,cexp}}
const nFard=P=>Math.round(P.f.length/(P.fs||3));
const rowLote=ri=>{const li=PAC.f[ri+2];return li>=0?PAC.lc[li]:""};
const rowDate=(ri,o)=>{if(!PAC.dd||(PAC.fs||3)<5)return"";return PAC.dd[PAC.f[ri+o]]||""};
const prodOfLote=c=>{const L=IX.lotes.get(c);if(L&&L.prod)return L.prod;const i=PAC.lc.indexOf(c);return i>=0?(PAC.lp[i]||""):""};
const cfgFoto=k=>{const c=(PAC&&PAC.carg)||{};return c[k]==="rec"?"rec":c[k]==="nao"?"nao":"obrig"}; // fp = placa, fl = lacre

// ---------- leitura da etiqueta: SAI (código de barras) ou link Abrapa (QR) ----------
function parseSAI(v){const d=String(v??"").replace(/\D/g,"");if(!d)return null;
  if(d.length===20&&d.startsWith("00")){const ss=d.slice(2);let t=0;for(let i=0;i<17;i++)t+=+ss[16-i]*(i%2?1:3);
    return{num:+d.slice(13,19),prensa:+d[12],ok:(10-t%10)%10===+ss[17],sai:true,code:d}}
  if(d.length<=7)return{num:+d,prensa:null,ok:true,sai:false};return{bad:true}}
function scanParse(txt){
  const m=String(txt||"").match(/\/00\/(\d{18})(?!\d)/);if(m){const p=parseSAI("00"+m[1]);if(p&&p.sai)return p}
  const d=String(txt||"").replace(/\D/g,"");let bad=null;
  for(let i=0;i+20<=d.length;i++){if(d[i]!=="0"||d[i+1]!=="0")continue;const p=parseSAI(d.slice(i,i+20));if(p&&p.sai){if(p.ok)return p;bad=bad||p}}
  if(bad)return{...bad,badCheck:true};if(d&&d.length<=7)return{num:+d,prensa:null,ok:true,sai:false};return null}
// fardo no pacote → {p,n,lote,ri} (sem prensa: prefere a prensa cujo lote está na carga)
function findFard(P,lotesCarga){
  const code=P.code||"";
  if(P.prensa){const ri=IX.f.get(P.prensa*1e7+P.num);return ri===undefined?null:{p:P.prensa,n:P.num,lote:rowLote(ri),ri,code}}
  const ps=IX.byN.get(P.num)||[];if(!ps.length)return null;
  const c=ps.map(p=>{const ri=IX.f.get(p*1e7+P.num);return{p,n:P.num,lote:rowLote(ri),ri,code}});
  if(c.length===1)return c[0];const m=c.filter(x=>lotesCarga&&lotesCarga.has(x.lote));return m.length===1?m[0]:{amb:c}}

// ---------- sons e vibração ----------
let AC=null;function beep(f,ms,n){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime;for(let i=0;i<(n||1);i++){const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type="square";g.gain.value=.12;o.connect(g);g.connect(AC.destination);const s=t0+i*(ms+70)/1000;o.start(s);o.stop(s+ms/1000)}}catch(e){}}
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const sOk=()=>{beep(1250,70);vib(40)},sDup=()=>{beep(600,120,2);vib([60,60,60])},sBad=()=>{beep(260,260,3);vib([300,120,300,120,300])},sLote=()=>{beep(1500,120,3);vib([100,60,100])};

// ---------- cargas ----------
const cur=()=>S.cargas.find(c=>c.id===S.atual)||null;
const ordemDe=id=>((PAC&&PAC.ordens)||[]).find(o=>String(o.id)===String(id))||null;
const cargaDaOrdem=id=>S.cargas.find(c=>String(c.oid)===String(id))||null;
const pedido=(c,l)=>{const it=c.itens.find(x=>String(x[0])===String(l));return it?+it[1]||0:0};
const lidosLote=(c,l)=>c.lidos.filter(x=>x.l===l).length;
const totPed=c=>c.itens.reduce((t,x)=>t+(+x[1]||0),0);
const completa=c=>c.itens.every(x=>lidosLote(c,String(x[0]))>=(+x[1]||0));
// fardo já expedido: data de saída na planilha, carga já registrada no app principal, ou lido em outra carga deste aparelho
function jaExpedido(F,c){const key=`${F.p}-${F.n}`;const ds=rowDate(F.ri,4);if(ds)return`saiu em ${ds}`;
  if(IX.cexp.has(key)){const o=IX.cexp.get(key);return o?`já carregado na ordem ${o}`:"já carregado em outra carga"}
  for(const z of S.cargas){if(z===c)continue;if(z.lidos.some(x=>x.p===F.p&&x.n===F.n))return`lido na carga da ordem ${z.ordem||"?"} (placa ${placaFmt(z.placa)}) neste aparelho`}
  return null}

// ---------- telas ----------
function render(){
  const c=cur();
  $("#sbar").classList.toggle("hide",!(PAC&&c&&c.status==="carregando"));
  $("#hSub").textContent=PAC?`Pacote de ${dtf(PAC.gerado)} · ${S.disp||"aparelho"}`:"Sem pacote carregado";
  const a=$("#app");
  if(!PAC){a.innerHTML=`<div class="card"><h2>Comece por aqui</h2><p>Este app faz o <b>carregamento dos fardos</b> pela leitura da etiqueta, confere a placa e a quantidade de cada lote, e funciona <b>sem internet</b>.</p>
    <ol><li>No app principal (com internet): <b>Carregamento 🚚 › Pacote para o coletor</b>.</li><li>Aqui: toque em <b>Carregar pacote</b> e escolha o arquivo <b>Pacote para o coletor - …</b> (.txt) — da pasta Downloads ou do <b>Google Drive</b>.</li></ol>
    <button class="btn pri big" type="button" id="bPac">📂 Carregar pacote</button></div>`;wire();return}
  if(c&&c.status==="carregando"){renderCarga(a,c);return}
  if(ui.view==="ord"&&ui.oid!=null){renderOrdem(a);return}
  renderHome(a)}

function renderHome(a){
  const ords=(PAC.ordens||[]).filter(o=>{const c=cargaDaOrdem(o.id);return !c||c.status==="carregando"||c.status==="pronta"});
  const byT=(x,y)=>String(y.fim||y.inicio).localeCompare(String(x.fim||x.inicio)),pends=S.cargas.filter(c=>c.status==="fechada"&&!c.exp).sort(byT),fins=S.cargas.filter(c=>c.status==="fechada"&&c.exp).sort(byT),pend=pends.length;
  const col=S.col||{},op=k=>col[k]!=null?col[k]:k!=="f";  // aberto por padrão: ordens e pendentes; finalizadas recolhidas
  const sec=(k,t,n,body,cls="")=>`<div class="card sec${cls}${op(k)?" open":""}"><button type="button" class="sech" data-sec="${k}"><h2>${t} (${fmt(n)})</h2><span class="chev">▾</span></button><div class="secb">${body}</div></div>`;
  const cgLi=(c,tag)=>`<li><div>${placaHTML(c.placa,true)}</div><div style="flex:1;min-width:0"><b>Ordem ${esc(c.ordem)}</b><br><small class="muted">${fmt(c.lidos.length)}/${fmt(totPed(c))} fardos · ${dtf(c.fim||c.inicio)}${c.parcial?" · parcial":""}</small></div><span class="r">${tag}</span></li>`;
  a.innerHTML=`${pend?`<button type="button" class="pbar" id="pBar">⚠ ${fmt(pend)} carga${pend>1?"s":""} aguardando envio <span>›</span></button>`:""}
    ${sec("o","Ordens de carregamento",ords.length,`
    ${ords.length>1?`<div class="osrch"><input id="oQ" type="text" enterkeyhint="search" placeholder="🔍 Placa ou nº da ordem" autocomplete="off" autocapitalize="characters" spellcheck="false" value="${esc(ui.q||"")}"><button type="button" id="oQx" class="${ui.q?"":"hide"}" aria-label="Limpar">✕</button></div><p class="muted hide" id="oQn" style="margin:0 0 10px">Nenhuma ordem com essa placa ou número.</p>`:""}
    ${ords.length?ords.map(o=>{const c=cargaDaOrdem(o.id),tp=o.itens.reduce((t,x)=>t+(+x[1]||0),0),run=c&&c.status==="carregando";
      return`<button class="ord${run?" run":""}" type="button" data-o="${esc(o.id)}" data-k="${esc(normQ(o.placa)+" "+normQ(o.ordem))}"><div class="oh">${placaHTML(o.placa,true)}<div class="oi"><div class="on">Ordem ${esc(o.ordem)}</div><div class="os">${esc(o.cli||"—")}${o.emissao?` · ${esc(o.emissao)}`:""}</div></div></div>
        <div class="olst">${o.itens.map(x=>{const n=c?c.lidos.filter(y=>y.l===String(x[0])).length:0;return`<div><span class="olt">Lote <b>${esc(x[0])}</b></span><span class="olq">${run?`${fmt(n)} / `:""}${fmt(x[1])} fd</span></div>`}).join("")}
        <div class="oltot"><span>${fmt(o.itens.length)} lote(s)</span><span>${run?`${fmt(c.lidos.length)} / `:""}${fmt(tp)} fd</span></div></div>${run?`<span class="tag warn">em carregamento</span>`:""}</button>`}).join(""):`<p class="muted" style="margin:0">Nenhuma ordem aberta no pacote. Cadastre ou importe as ordens no app principal e baixe um pacote novo.</p>`}`)}
    ${sec("p","Cargas fechadas aguardando envio",pend,pend?`<ul class="lst">${pends.map(c=>cgLi(c,`<span class="tag blue">pendente</span>`)).join("")}</ul><p class="hint" style="margin:8px 0">Exporte e importe no app principal para dar a baixa nos lotes.</p><button class="btn pri big" type="button" id="bExp">⤓ Exportar cargas (${pend})</button>`:`<p class="muted" style="margin:0">Nenhuma carga aguardando envio.</p>`,pend?" pend":"")}
    ${sec("f","Cargas finalizadas",fins.length,fins.length?`<ul class="lst">${fins.map(c=>cgLi(c,`<span class="tag ok">exportada</span>`)).join("")}</ul><p class="hint" style="margin:8px 0 0">Já exportadas. Depois de importar no app principal, dá para apagá-las em Menu › Apagar cargas já exportadas.</p>`:`<p class="muted" style="margin:0">Nenhuma carga finalizada neste aparelho.</p>`)}`;
  const pb=$("#pBar");if(pb)pb.onclick=()=>{const cd=a.querySelector('[data-sec="p"]').parentElement;if(!cd.classList.contains("open")){cd.classList.add("open");S.col={...(S.col||{}),p:true};saveState()}cd.scrollIntoView({behavior:"smooth",block:"start"})};
  a.querySelectorAll("[data-sec]").forEach(h=>h.onclick=()=>{const k=h.dataset.sec,cd=h.parentElement,o=!cd.classList.contains("open");cd.classList.toggle("open",o);S.col={...(S.col||{}),[k]:o};saveState()});
  wire();a.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{const c=cargaDaOrdem(b.dataset.o);if(c&&c.status==="carregando"){S.atual=c.id;ui.flash=null;saveState();render();return}ui.view="ord";ui.oid=b.dataset.o;ui.prep=null;render();scrollTo(0,0)});
  // busca por placa ou nº da ordem (filtra na hora, sem redesenhar a tela)
  const q=$("#oQ");if(q){const bs=[...a.querySelectorAll("[data-o]")],x=$("#oQx"),nn=$("#oQn");
    const flt=()=>{ui.q=q.value;const t=normQ(q.value);let v=0;for(const b of bs){const ok=!t||b.dataset.k.split(" ").some(k=>k.includes(t));b.classList.toggle("hide",!ok);if(ok)v++}x.classList.toggle("hide",!q.value);nn.classList.toggle("hide",v>0);return bs.filter(b=>!b.classList.contains("hide"))};
    q.oninput=flt;q.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();const vs=flt();if(vs.length===1)vs[0].click()}};x.onclick=()=>{q.value="";flt();q.focus()};flt()}}
const normQ=v=>String(v||"").toUpperCase().replace(/[^0-9A-Z]/g,"");

// ordem escolhida: confere a placa (foto) e inicia
function renderOrdem(a){const o=ordemDe(ui.oid);if(!o){ui.view="home";render();return}
  const P=ui.prep||(ui.prep={foto:null,ok:false,semFoto:"",conf:S.conf||""});const fp=cfgFoto("fp"),tp=o.itens.reduce((t,x)=>t+(+x[1]||0),0);
  const pode=P.ok&&P.conf.trim()&&(P.foto||fp!=="obrig");
  a.innerHTML=`<div class="card"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><h2 style="flex:1;margin:0">Ordem ${esc(o.ordem)}</h2><button class="btn" type="button" id="bVolta" style="padding:6px 12px">◀ Voltar</button></div>
    <div style="text-align:center;margin:6px 0 10px">${placaHTML(o.placa)}</div>
    <p style="margin:0 0 4px"><b>Cliente:</b> ${esc(o.cli||"—")}${o.emissao?` · <b>Emissão:</b> ${esc(o.emissao)}`:""}</p>
    <table class="itab"><thead><tr><th>Lote</th><th>Produtor · box</th><th style="text-align:right">Fardos</th></tr></thead><tbody>
    ${o.itens.map(x=>`<tr><td class="lt">${esc(x[0])}</td><td>${esc(prodOfLote(String(x[0]))||"—")}${locBtn(x[0])}</td><td class="q">${fmt(x[1])}</td></tr>`).join("")}
    <tr><td colspan="2"><b>Total</b></td><td class="q">${fmt(tp)}</td></tr></tbody></table></div>
    <div class="card"><h2>Conferência da placa</h2>
    ${fp==="nao"?"":`<div class="foto">${P.foto?`<img src="${P.foto}" alt="Foto da placa">`:`<img alt="">`}<div class="fi">${P.foto?`<span class="tag ok">✓ foto tirada</span><br><button class="btn" type="button" id="bFoto" style="margin-top:6px;padding:8px 12px">↺ Tirar de novo</button>`:`<button class="btn ${fp==="obrig"?"pri":""}" type="button" id="bFoto" style="width:100%">📷 Foto da placa${fp==="obrig"?" (obrigatória)":""}</button>`}</div></div>`}
    ${fp==="rec"&&!P.foto?`<label class="fld"><span>Sem foto? Informe o motivo (opcional)</span><input id="iSem" value="${esc(P.semFoto)}" placeholder="ex.: câmera com defeito"></label>`:""}
    <label class="chk${P.ok?" on":""}"><input type="checkbox" id="cOk"${P.ok?" checked":""}> <span>Conferi: a placa do caminhão é <b>${esc(placaFmt(o.placa))}</b></span></label>
    <label class="fld"><span>Conferente (quem está carregando)</span><input id="iConf" value="${esc(P.conf)}" placeholder="Nome" autocomplete="name"></label>
    <button class="btn pri big" type="button" id="bIni" style="margin-top:12px"${pode?"":" disabled"}>▶ Iniciar carregamento</button>
    ${!pode?`<p class="hint">${!P.ok?"Confira a placa e marque a caixa.":fp==="obrig"&&!P.foto?"Tire a foto da placa para iniciar.":"Informe o conferente."}</p>`:""}</div>`;
  $("#bVolta").onclick=()=>{ui.view="home";ui.oid=null;ui.prep=null;render()};
  const bf=$("#bFoto");if(bf)bf.onclick=()=>tirarFoto(d=>{P.foto=d;render()});
  $("#cOk").onchange=e=>{P.ok=e.target.checked;render()};
  const ic=$("#iConf");ic.oninput=()=>{P.conf=ic.value;const b=$("#bIni");if(b)b.disabled=!(P.ok&&P.conf.trim()&&(P.foto||fp!=="obrig"))};ic.onchange=()=>render();
  const is=$("#iSem");if(is)is.oninput=()=>{P.semFoto=is.value};
  $("#bIni").onclick=()=>{if(!(P.ok&&P.conf.trim()&&(P.foto||fp!=="obrig")))return;S.conf=P.conf.trim();
    let c=cargaDaOrdem(o.id);if(!c){c={id:uid(),oid:o.id,ordem:o.ordem,placa:o.placa,cli:o.cli||"",emissao:o.emissao||"",itens:o.itens.map(x=>[String(x[0]),+x[1]||0]),conf:S.conf,disp:S.disp||"",
      inicio:nowISO(),fim:null,status:"carregando",fotoPlaca:P.foto?{d:P.foto,t:nowISO()}:null,semFotoPlaca:P.foto?"":(P.semFoto||"").trim(),fotoLacre:null,semFotoLacre:"",parcial:false,motivo:"",lidos:[],alertas:[],desc:[],exp:false};S.cargas.push(c)}
    else{c.status="carregando";if(P.foto)c.fotoPlaca={d:P.foto,t:nowISO()}}
    S.atual=c.id;ui.view="home";ui.oid=null;ui.prep=null;ui.flash={c:"idle",t:"Leia o primeiro fardo"};saveState();render();focusScan()}}

// carregamento em andamento: contador por lote
function renderCarga(a,c){const tp=totPed(c),tl=c.lidos.length,fl=ui.flash||{c:"idle",t:"Aguardando leitura…"},last=ui.lastLote;
  const done=completa(c);
  a.innerHTML=`<div class="card"><div style="display:flex;align-items:center;gap:12px">${placaHTML(c.placa,true)}<div style="flex:1;min-width:0"><div style="font:800 19px/1.1 system-ui">Ordem ${esc(c.ordem)}</div><div class="hint" style="margin:2px 0 0">${esc(c.cli||"")} · ${esc(c.conf||"")}</div></div></div>
    <div class="flash ${done?"done":fl.c}">${done?"✓ CARGA COMPLETA — toque em Finalizar":esc(fl.t)}</div>
    <div class="cnt">${fmt(tl)}<small> / ${fmt(tp)}</small></div><div class="bar"><i style="width:${tp?Math.min(100,tl/tp*100):0}%"></i></div>
    <table class="itab" style="margin-top:10px"><thead><tr><th>Lote</th><th style="text-align:right">Lidos / pedidos</th></tr></thead><tbody>

// cancelar: apaga as leituras e as fotos desta carga; a ordem volta para a lista
function cancelarCarga(c){showSheet(`<h3>Cancelar o carregamento?</h3><p>Ordem <b>${esc(c.ordem)}</b> · placa <b>${esc(placaFmt(c.placa))}</b></p>

// finalizar: confere o que falta, foto do lacre / carga fechada
function finalizar(c){const fl=cfgFoto("fl"),falta=c.itens.map(([l,q])=>[l,q,lidosLote(c,l)]).filter(x=>x[2]<x[1]);
  const MOT=(PAC&&PAC.carg&&Array.isArray(PAC.carg.motivos)&&PAC.carg.motivos.length)?PAC.carg.motivos:["Caminhão lotado","Fardo não encontrado","Fardo avariado"];
  const st={foto:c.fotoLacre?c.fotoLacre.d:null,motivo:c.motivo||"",sem:c.semFotoLacre||"",sel:c.motivo?(MOT.includes(c.motivo)?c.motivo:"__o"):"",outro:c.motivo&&!MOT.includes(c.motivo)?c.motivo:""};
  const motF=()=>st.sel==="__o"?st.outro.trim():st.sel;
  const draw=()=>{st.motivo=motF();const ok=(!falta.length||st.motivo)&&(st.foto||fl!=="obrig");
    showSheet(`<h3>Finalizar carga · ordem ${esc(c.ordem)}</h3>
      ${falta.length?`<div class="sbad">Faltam fardos:<br>${falta.map(([l,q,n])=>`Lote <b>${esc(l)}</b>: ${fmt(n)} de ${fmt(q)} (faltam ${fmt(q-n)})`).join("<br>")}</div>
        <label class="fld"><span>Motivo para fechar incompleta (obrigatório)</span><select id="fMot"><option value=""${st.sel?"":" selected"}>Escolha o motivo…</option>${MOT.map(m=>`<option${st.sel===m?" selected":""}>${esc(m)}</option>`).join("")}<option value="__o"${st.sel==="__o"?" selected":""}>Outro (descrever)</option></select></label>
        ${st.sel==="__o"?`<label class="fld"><span>Descreva o motivo</span><input id="fOut" value="${esc(st.outro)}" maxlength="80"></label>`:""}`:`<div class="sok">✓ Todos os lotes com a quantidade pedida (${fmt(c.lidos.length)} fardos).</div>`}
      ${fl==="nao"?"":`<p style="margin:12px 0 0;font-weight:700">Foto da carga fechada / lacre${fl==="obrig"?" (obrigatória)":""}</p>
      <div class="foto">${st.foto?`<img src="${st.foto}" alt="">`:`<img alt="">`}<div class="fi"><button class="btn ${st.foto?"":"pri"}" type="button" id="fFt" style="width:100%">${st.foto?"↺ Tirar de novo":"📷 Tirar foto"}</button></div></div>
      ${fl==="rec"&&!st.foto?`<label class="fld"><span>Sem foto? Motivo (opcional)</span><input id="fSem" value="${esc(st.sem)}"></label>`:""}`}
      <button class="btn pri big" type="button" id="fOk" style="margin-top:14px"${ok?"":" disabled"}>✓ Fechar carga</button>
      <button class="btn big" type="button" data-x style="margin-top:8px">Voltar ao carregamento</button>`,o=>{
      const m=o.querySelector("#fMot");if(m)m.onchange=()=>{st.sel=m.value;draw();const f=document.querySelector("#fOut");if(f)f.focus()};
      const ou=o.querySelector("#fOut");if(ou)ou.oninput=()=>{st.outro=ou.value;st.motivo=motF();o.querySelector("#fOk").disabled=!(st.motivo&&(st.foto||fl!=="obrig"))};
      const s=o.querySelector("#fSem");if(s)s.oninput=()=>{st.sem=s.value};
      const ft=o.querySelector("#fFt");if(ft)ft.onclick=()=>tirarFoto(d=>{st.foto=d;draw()});
      o.querySelector("#fOk").onclick=()=>{st.motivo=motF();if(falta.length&&!st.motivo)return;if(fl==="obrig"&&!st.foto)return;
        c.fotoLacre=st.foto?{d:st.foto,t:nowISO()}:null;c.semFotoLacre=st.foto?"":st.sem.trim();c.parcial=!!falta.length;c.motivo=falta.length?st.motivo.trim():"";
        c.fim=nowISO();c.status="fechada";c.exp=false;S.atual=null;ui.flash=null;saveState();closeSheet();render();
        showSheet(`<h3>Carga fechada ✓</h3><p>Ordem <b>${esc(c.ordem)}</b> · placa <b>${esc(placaFmt(c.placa))}</b> · ${fmt(c.lidos.length)} fardos${c.parcial?" (parcial)":""}.</p><p>Exporte as cargas e importe no app principal para dar a baixa nos lotes.</p><button class="btn pri big" type="button" id="kExp" style="margin-bottom:8px">⤓ Exportar agora</button><button class="btn big" type="button" data-x>Depois</button>`,o2=>{o2.querySelector("#kExp").onclick=()=>{closeSheet();exportar()}})}})};
  draw()}

// ---------- foto (câmera do aparelho) reduzida para ~1280 px JPEG ----------
let _fotoCb=null;
// câmera do app com moldura PAISAGEM (4:3): o celular fica em pé e a foto já sai deitada, no formato do romaneio
async function tirarFoto(cb){
  const fb=()=>{_fotoCb=cb;const i=$("#fFoto");i.value="";i.click()};
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){fb();return}
  const c=document.createElement("div");c.className="cam";c.innerHTML=`<div class="vw"><video playsinline muted autoplay></video><div class="pfr"><div class="pbox"><span>Enquadre aqui</span></div></div></div><div class="cmsg" id="pMsg">Abrindo a câmera…</div>
    <div class="cbar"><button class="btn big" type="button" id="pX" style="flex:1">Cancelar</button><button class="btn pri big" type="button" id="pOk" style="flex:2" disabled>📷 Tirar foto</button></div>`;document.body.appendChild(c);
  const v=c.querySelector("video");let st=null,kd=null;const close=()=>{try{st&&st.getTracks().forEach(t=>t.stop())}catch(e){}if(kd)document.removeEventListener("keydown",kd,true);c.remove()};
  $("#pX").onclick=()=>{close();focusScan()};
  try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},audio:false});v.srcObject=st;await v.play()}
  catch(e){close();fb();return}
  $("#pMsg").textContent="Enquadre na moldura e aperte o botão de leitura (ou Tirar foto)";$("#pOk").disabled=false;
  // botão físico de leitura do coletor (gatilho), Enter ou qualquer tecla do leitor: tira a foto
  let shot=false;kd=e=>{if(shot)return;if(e.key==="Escape"){e.preventDefault();close();focusScan();return}if(e.key==="Backspace")return;e.preventDefault();e.stopPropagation();shot=true;$("#pOk").click()};
  setTimeout(()=>document.addEventListener("keydown",kd,true),400);
  $("#pOk").onclick=()=>{try{const vw=v.clientWidth,vh=v.clientHeight,W=v.videoWidth,H=v.videoHeight,k=Math.max(vw/W,vh/H),ox=(vw-W*k)/2,oy=(vh-H*k)/2;
      const b=c.querySelector(".pbox").getBoundingClientRect(),r=v.getBoundingClientRect();
      let sx=(b.left-r.left-ox)/k,sy=(b.top-r.top-oy)/k,sw=b.width/k,sh=b.height/k;sx=Math.max(0,sx);sy=Math.max(0,sy);sw=Math.min(W-sx,sw);sh=Math.min(H-sy,sh);
      const ow=Math.min(1280,Math.round(sw)),oh=Math.round(ow*3/4),cv=document.createElement("canvas");cv.width=ow;cv.height=oh;cv.getContext("2d").drawImage(v,sx,sy,sw,sh,0,0,ow,oh);
      const d=cv.toDataURL("image/jpeg",.72);close();beep(1000,60);cb(d)}catch(e){close();toast("Não foi possível tirar a foto.")}}}
$("#fFoto").onchange=async e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(!f||!_fotoCb)return;const cb=_fotoCb;_fotoCb=null;
  try{const d=await reduzFoto(f);cb(d)}catch(err){toast("Não foi possível ler a foto.")}};
function reduzFoto(f){return new Promise((ok,ko)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{try{let sx=0,sy=0,w=im.naturalWidth,h=im.naturalHeight;
  if(w/h>4/3){const nw=h*4/3;sx=(w-nw)/2;w=nw}else{const nh=w*3/4;sy=(h-nh)/2;h=nh}
  const k=Math.min(1,1280/w),cv=document.createElement("canvas");cv.width=Math.round(w*k);cv.height=Math.round(h*k);
  cv.getContext("2d").drawImage(im,sx,sy,w,h,0,0,cv.width,cv.height);URL.revokeObjectURL(u);ok(cv.toDataURL("image/jpeg",.72))}catch(e){ko(e)}};im.onerror=()=>{URL.revokeObjectURL(u);ko()};im.src=u})}

function focusScan(){const i=$("#scan");const c=cur();if(ui.kbOff)return;if(i&&c&&c.status==="carregando"&&!ui.lock&&!$(".ovl")&&!$(".cam")&&!$(".mapv")&&document.activeElement!==i){try{i.focus({preventScroll:true})}catch(e){i.focus()}}}
function wire(){const on=(id,f)=>{const e=$(id);if(e)e.onclick=f};on("#bPac",()=>$("#fPac").click());on("#bExp",exportar)}
// campo de leitura fixo (nunca é recriado: o teclado do coletor continua aberto entre as leituras)
(()=>{const i=$("#scan");let tm=null;const go=()=>{clearTimeout(tm);const v=i.value.trim();i.value="";_pv="";if(v)onRead(v)};
  $("#bGo").onclick=go;$("#bCam").onclick=openCam;
  i.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key==="Tab"){e.preventDefault();go()}});
  i.addEventListener("focus",()=>{ui.kbOff=false});
  i.addEventListener("input",()=>{clearTimeout(tm);const v=i.value;if(v)noteRaw(v);if(/\/00\/\d{18}/.test(v)||/\d{20}/.test(v.replace(/\D/g,"")))tm=setTimeout(go,180)});
  i.addEventListener("blur",()=>setTimeout(()=>{const a=document.activeElement;if(!a||a===document.body)focusScan()},300))})();
document.addEventListener("pointerdown",e=>{const b=e.target.closest&&e.target.closest("button,.btn");if(b&&document.activeElement===$("#scan"))e.preventDefault()},true);
let _pv="",_pt=0;
setInterval(()=>{const i=$("#scan");if(!i||ui.lock)return;const v=i.value;if(v!==_pv){_pv=v;_pt=Date.now();if(v)noteRaw(v);return}
  if(v&&Date.now()-_pt>350&&(/\/00\/\d{18}/.test(v)||v.replace(/\D/g,"").length>=12)){i.value="";_pv="";onRead(v.trim())}},150);
let _kb="",_kt=0,_kto=null;
document.addEventListener("keydown",e=>{const t=e.target;if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"))return;if(ui.lock)return;const c=cur();if(!c||c.status!=="carregando")return;
  if(e.key==="Enter"){if(_kb.length>=6){const v=_kb;_kb="";noteRaw(v);onRead(v)}_kb="";return}
  if(e.key&&e.key.length===1){const n=Date.now();if(n-_kt>300)_kb="";_kb+=e.key;_kt=n;clearTimeout(_kto);
    _kto=setTimeout(()=>{if(_kb.length>=12){const v=_kb;_kb="";noteRaw(v);onRead(v)}else _kb=""},350)}},true);
function noteRaw(v){ui.lastRaw={v:String(v).slice(0,80),t:Date.now()};const e=$("#raw");if(e)e.textContent=`Última leitura recebida: ${ui.lastRaw.v}`}

// ---------- uma leitura ----------
function onRead(raw){
  if(ui.lock){sBad();return}
  const c=cur();if(!c||c.status!=="carregando")return;
  const P=scanParse(String(raw).trim());
  if(!P||P.bad){ui.flash={c:"dup",t:"Código não reconhecido"};sDup();render();return}
  const F=findFard(P,new Set(c.itens.map(x=>String(x[0]))));
  if(!F){c.desc.push({p:P.prensa||0,n:P.num,t:nowISO()});saveState();
    lockScreen("warn",`<h3>⚠ FARDO FORA DO PACOTE</h3><p>P${P.prensa||"?"} ${g3(P.num)} não está no pacote deste aparelho (classificado depois da última sincronização?).</p><p><b>Não foi contado.</b> Baixe um pacote novo ou separe o fardo.</p>`,[["Entendi — continuar",unlock]]);return}
  if(F.amb){showSheet(`<h3>Nº ${g3(P.num)} existe nas prensas ${F.amb.map(x=>x.p).join(" e ")}</h3><p>Qual é a deste fardo?</p>${F.amb.map(x=>`<button class="btn big" type="button" data-amb="${x.p}" style="margin-bottom:8px">Prensa ${x.p} · lote ${esc(x.lote||"sem lote")}</button>`).join("")}`,o=>o.querySelectorAll("[data-amb]").forEach(b=>b.onclick=()=>{closeSheet();const F2=F.amb.find(x=>String(x.p)===b.dataset.amb);conta(c,F2)}));return}
  conta(c,F)}
function conta(c,F){const key=`${F.p}-${F.n}`,rec=k=>{c.alertas.push({p:F.p,n:F.n,l:F.lote||"",k,t:nowISO()});saveState()};
  if(c.lidos.some(x=>x.p===F.p&&x.n===F.n)){ui.flash={c:"dup",t:`Já lido nesta carga: P${F.p} ${g3(F.n)} (não contou de novo)`};sDup();render();return}
  const je=jaExpedido(F,c);
  if(je){rec("exp");sBad();lockScreen("bad",`<h3>⚠ FARDO JÁ EXPEDIDO</h3><p>Fardo <b>P${F.p} ${g3(F.n)}</b> do lote</p><div class="lt">${esc(F.lote||"—")}</div><p>${esc(je)}.</p><p><b>Este fardo não foi contado.</b></p>`,[["Retirei o fardo — continuar",unlock]]);return}
  if(!F.lote){rec("semlote");sBad();lockScreen("bad",`<h3>⚠ FARDO SEM LOTE</h3><p>P${F.p} ${g3(F.n)} ainda não tem lote (aguardando HVI).</p><p><b>Não foi contado.</b></p>`,[["Retirei o fardo — continuar",unlock]]);return}
  const q=pedido(c,F.lote);
  if(!q){rec("lote");sBad();lockScreen("bad",`<h3>⚠ NÃO É DESTA CARGA</h3><p>Fardo <b>P${F.p} ${g3(F.n)}</b> é do lote</p><div class="lt">${esc(F.lote)}</div><p>${esc(prodOfLote(F.lote)||"")}</p><p>Esta carga leva os lotes <b>${c.itens.map(x=>esc(x[0])).join(", ")}</b>.<br><b>Este fardo não foi contado.</b></p>`,[["Retirei o fardo — continuar",unlock]]);return}
  const n=lidosLote(c,F.lote);
  if(n>=q){rec("qtd");sBad();lockScreen("warn",`<h3>⚠ LOTE JÁ COMPLETO</h3><p>O lote</p><div class="lt">${esc(F.lote)}</div><p>já tem <b>${fmt(n)} de ${fmt(q)}</b> fardos pedidos nesta carga.</p><p><b>Este fardo não foi contado.</b> Retire-o do caminhão.</p>`,[["Retirei o fardo — continuar",unlock]]);return}
  c.lidos.push({p:F.p,n:F.n,l:F.lote,t:nowISO()});saveState();ui.lastLote=F.lote;
  if(completa(c)){ui.flash={c:"done",t:"✓ CARGA COMPLETA"};beep(1500,160,4);vib([150,80,150,80,150])}
  else if(n+1===q){ui.flash={c:"ok",t:`✓ P${F.p} ${g3(F.n)} · LOTE ${F.lote} COMPLETO (${fmt(q)})`};sLote()}
  else{ui.flash={c:"ok",t:`✓ P${F.p} ${g3(F.n)} · lote ${F.lote} · ${fmt(n+1)}/${fmt(q)}`};sOk()}
  render()}

// ---------- tela travada (alerta) e folhas ----------

  d.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>btns[+b.dataset.b][1]());const rep=setInterval(()=>{if(!ui.lock){clearInterval(rep);return}vib(200)},2500)}
function unlock(){ui.lock=null;const d=$("#lock");if(d)d.remove();const i=$("#scan");if(i){i.value="";_pv=""}ui.flash={c:"idle",t:"Aguardando leitura…"};render();focusScan()}
function showSheet(html,init){closeSheet(true);{const i=$("#scan");if(i)i.blur()}
  const o=document.createElement("div");o.className="ovl";o.innerHTML=`<div class="sheet">${html}</div>`;document.body.appendChild(o);
  o.onclick=e=>{if(e.target===o||e.target.hasAttribute("data-x"))closeSheet()};if(init)init(o)}

// ---------- nome do coletor: padrão "COLETOR 01", o mesmo nos apps Marcação, Emblocamento e Carregamento deste aparelho ----------
const DEV_LS="decotton-coletor-nome",DEV_RE=/^COLETOR \d{2,3}$/;
const devFmt=n=>"COLETOR "+String(Math.max(1,Math.trunc(+n)||1)).padStart(2,"0");
const devNum=v=>{const m=/coletor\D*0*(\d{1,3})\b/i.exec(String(v||""));return m?+m[1]:null};
function devShared(){try{return localStorage.getItem(DEV_LS)||""}catch(e){return""}}
function devSet(v){S.disp=v;try{localStorage.setItem(DEV_LS,v)}catch(e){}saveState()}
function devInit(){const sh=devShared();
  if(sh&&DEV_RE.test(sh)){if(S.disp!==sh){S.disp=sh;saveState()}}
  else if(S.disp&&devNum(S.disp)!=null&&/^\s*coletor\s*\d{1,3}\s*$/i.test(S.disp))devSet(devFmt(devNum(S.disp)));
  if(!DEV_RE.test(S.disp||""))setTimeout(()=>{if(!$(".ovl")&&!DEV_RE.test(S.disp||""))openDev(true)},900)}
function openDev(first){const n=devNum(S.disp);
  showSheet(`<h3>Nome deste coletor</h3>
    <p class="hint" style="margin-top:0">${first?(S.disp?`Este aparelho está como <b>${esc(S.disp)}</b>. Para padronizar, informe o número do coletor.`:"Informe o número deste coletor."):"Informe o número do coletor."} O nome vale para os apps Marcação, Emblocamento e Carregamento neste aparelho e aparece nos arquivos importados no app principal.</p>
    <div class="devrow"><span>COLETOR</span><input id="devN" type="number" inputmode="numeric" min="1" max="999" value="${n!=null?n:""}" placeholder="01" aria-label="Número do coletor"></div>
    <p class="devpv" id="devPv">${n!=null?esc(devFmt(n)):"&nbsp;"}</p>
    <button class="btn pri big" type="button" id="devOk"${n!=null?"":" disabled"}>Salvar</button>
    <button class="btn big" type="button" data-x style="margin-top:8px">${first?"Depois":"Cancelar"}</button>`,o=>{
    const i=o.querySelector("#devN"),pv=o.querySelector("#devPv"),ok=o.querySelector("#devOk");
    const up=()=>{const v=+i.value;const valid=v>=1&&v<=999&&Number.isInteger(v);ok.disabled=!valid;pv.innerHTML=valid?esc(devFmt(v)):"&nbsp;"};
    i.oninput=up;i.onkeydown=e=>{if(e.key==="Enter"&&!ok.disabled){e.preventDefault();ok.click()}};
    ok.onclick=()=>{devSet(devFmt(+i.value));closeSheet();render();toast(`Nome do aparelho: ${S.disp}`)};
    setTimeout(()=>{try{i.focus();i.select()}catch(e){}},80)})}
// item do menu: ícone, título, detalhe e (opcional) contador de pendências
const mnG=t=>`<div class="mng">${t}</div>`;

  $("#mExp").onclick=()=>{closeSheet();exportar()};
  $("#mDisp").onclick=()=>openDev();
  $("#mLimpa").onclick=()=>{const n=S.cargas.filter(c=>c.exp).length;if(!n){toast("Nenhuma carga exportada para apagar.");return}
    if(confirm(`Apagar ${n} carga(s) já exportada(s) deste aparelho? Faça isso só depois de importar o arquivo no app principal.`)){S.cargas=S.cargas.filter(c=>!c.exp);if(!cur())S.atual=null;saveState();closeSheet();render()}}})};
function openCargas(){const L=S.cargas.slice().sort((a,b)=>String(b.fim||b.inicio).localeCompare(String(a.fim||a.inicio)));
  showSheet(`<h3>Cargas no aparelho</h3>${L.length?`<ul class="lst">${L.map(c=>`<li><div>${placaHTML(c.placa,true)}</div><div style="flex:1;min-width:0"><b>Ordem ${esc(c.ordem)}</b><br><small class="muted">${fmt(c.lidos.length)}/${fmt(totPed(c))} fardos · ${dtf(c.fim||c.inicio)}${c.parcial?" · parcial":""}</small></div>
    <span class="r">${c.status==="carregando"?`<span class="tag warn">em carregamento</span><br><button class="btn" type="button" data-cont="${c.id}" style="padding:6px 10px;font-size:14px;margin-top:4px">Continuar</button>`:c.exp?`<span class="tag ok">exportada</span>`:`<span class="tag blue">fechada · pendente</span>`}<br><button class="btn" type="button" data-canc="${c.id}" style="padding:6px 10px;font-size:14px;margin-top:4px;color:var(--bad)">✕ Cancelar</button></span></li>`).join("")}</ul>`:`<p class="muted">Nenhuma carga neste aparelho.</p>`}
    ${L.some(c=>c.status==="fechada")?`<button class="btn pri big" type="button" id="cgExp" style="margin-top:10px">⤓ Exportar cargas</button>`:""}<button class="btn big" type="button" data-x style="margin-top:8px">Fechar</button>`,o=>{
    o.querySelectorAll("[data-cont]").forEach(b=>b.onclick=()=>{S.atual=b.dataset.cont;ui.flash=null;saveState();closeSheet();render()});
    o.querySelectorAll("[data-canc]").forEach(b=>b.onclick=()=>{const c=S.cargas.find(z=>z.id===b.dataset.canc);if(c)cancelarCarga(c)});
    const e=o.querySelector("#cgExp");if(e)e.onclick=()=>{closeSheet();exportar()}})}

// ---------- pacote ----------
$("#fPac").onchange=async e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;
  try{const j=JSON.parse(await f.text());if(j.tipo!=="rsp-coletor-pacote")throw 0;
    if(!Array.isArray(j.ordens)){toast("Este pacote não tem ordens de carregamento: gere um pacote novo no app principal (aba Carregamento).",5000)}
    PAC=j;IX=buildIndex(j);await DB.set("pacote",j);
    // cargas exportadas que o app principal já registrou (estão no pacote novo) saem do aparelho
    let rm=0;S.cargas=S.cargas.filter(c=>{if(c.exp&&c.lidos.length&&c.lidos.every(x=>IX.cexp.has(`${x.p}-${x.n}`))){rm++;return false}return true});
    if(!cur())S.atual=null;await saveState();
    ui.view="home";render();toast(`Pacote carregado: ${fmt((j.ordens||[]).length)} ordem(ns) · ${fmt(nFard(j))} fardos${rm?` · ${rm} carga(s) já registradas foram limpas`:""}`,4000)}
  catch(err){toast("Arquivo inválido: escolha o Pacote para o coletor gerado no app principal.",4000)}};

// ---------- exportar cargas (leituras + fotos) ----------
function exportar(){const cs=S.cargas.filter(c=>c.status==="fechada");if(!cs.length){toast("Nenhuma carga fechada para exportar.");return}
  const j={tipo:"rsp-carregamento-leituras",v:1,disp:S.disp||"",app:VER,exportado:nowISO(),pacote:PAC?PAC.gerado:null,
    cargas:cs.map(c=>({id:c.id,oid:c.oid,ordem:c.ordem,placa:c.placa,cli:c.cli,emissao:c.emissao,itens:c.itens,conf:c.conf,disp:c.disp,inicio:c.inicio,fim:c.fim,parcial:c.parcial,motivo:c.motivo,
      fotoPlaca:c.fotoPlaca,semFotoPlaca:c.semFotoPlaca,fotoLacre:c.fotoLacre,semFotoLacre:c.semFotoLacre,lidos:c.lidos,alertas:c.alertas,desc:c.desc}))};
  const d=new Date(),p=n=>String(n).padStart(2,"0"),cl=t=>String(t||"").replace(/[\\/:*?"<>|]+/g," ").replace(/\s+/g," ").trim();
  const name=`${cl("Cargas do coletor"+(S.disp?` (${S.disp})`:""))} - ${cl(PAC&&PAC.emp)||"Algodoeira"} - ${p(d.getDate())}-${p(d.getMonth()+1)}-${d.getFullYear()} - ${p(d.getHours())}h${p(d.getMinutes())}m${p(d.getSeconds())}s.txt`;
  const blob=new Blob([JSON.stringify(j)],{type:"text/plain"});let file=null,canSh=false;
  try{file=new File([blob],name,{type:"text/plain"});canSh=!!(navigator.canShare&&navigator.canShare({files:[file]}))}catch(e){}
  const done=async(onde)=>{cs.forEach(c=>c.exp=true);await saveState();closeSheet();render();
    showSheet(`<h3>Cargas exportadas</h3><p>Arquivo <b>${esc(name)}</b> ${onde}.</p><p>No app principal (com internet): <b>Carregamento 🚚 › Importar cargas do coletor</b>.</p><button class="btn pri big" type="button" data-x>OK</button>`)};
  showSheet(`<h3>Exportar cargas</h3><p>${fmt(cs.length)} carga(s) fechada(s) · ${fmt(cs.reduce((t,c)=>t+c.lidos.length,0))} fardo(s)${cs.some(c=>c.exp)?` · inclui ${cs.filter(c=>c.exp).length} já exportada(s) antes`:""}.</p>
    ${canSh?`<button class="btn pri big" type="button" id="exDrive" style="margin-bottom:8px">☁ Enviar (Drive, Bluetooth…)</button><p class="hint" style="margin:-2px 0 10px">Abre o "Compartilhar": escolha <b>Drive</b> (Salvar no Drive) ou <b>Bluetooth</b>.</p>`:""}
    <button class="btn big" type="button" id="exDev" style="margin-bottom:8px">⤓ Salvar no aparelho (Downloads)</button><button class="btn big" type="button" data-x>Cancelar</button>`,o=>{
    const dr=$("#exDrive");if(dr)dr.onclick=async()=>{try{await navigator.share({files:[file],title:name});await done("enviado pelo Compartilhar")}catch(e){if(!(e&&e.name==="AbortError"))toast("Não foi possível compartilhar. Use Salvar no aparelho.")}};
    $("#exDev").onclick=async()=>{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);await done("salvo no aparelho (pasta Downloads)")}})}

// ---------- câmera (leitura da etiqueta pelo celular) ----------
const ZXW="https://cdn.jsdelivr.net/npm/zxing-wasm@2.2.4/dist/iife/reader/index.js",ZXW_WASM="https://cdn.jsdelivr.net/npm/zxing-wasm@2.2.4/dist/reader/zxing_reader.wasm";
let zxwP=null;function loadZXW(){if(window.ZXingWASM)return Promise.resolve();if(zxwP)return zxwP;zxwP=new Promise((ok,ko)=>{const s=document.createElement("script");s.src=ZXW;s.onload=()=>{try{const Z=window.ZXingWASM,ov={locateFile:(p,pre)=>/\.wasm$/.test(p)?ZXW_WASM:pre+p};if(Z.prepareZXingModule)Z.prepareZXingModule({overrides:ov});else if(Z.setZXingModuleOverrides)Z.setZXingModuleOverrides(ov)}catch(e){}ok()};s.onerror=()=>{zxwP=null;ko()};document.head.appendChild(s)});return zxwP}
async function openCam(){
  const c=document.createElement("div");c.className="cam";c.innerHTML=`<video playsinline muted autoplay></video><div class="tgt"></div><div class="cmsg" id="cMsg">Abrindo a câmera…</div><div class="cbar"><button class="btn big" type="button" id="cClose">Fechar câmera</button></div>`;document.body.appendChild(c);
  const v=c.querySelector("video"),msg=t=>{const m=$("#cMsg");if(m)m.textContent=t};let stream=null,run=true,last="",lastT=0;
  const close=()=>{run=false;try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(e){}c.remove();focusScan()};$("#cClose").onclick=close;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},audio:false});v.srcObject=stream;await v.play()}
  catch(e){msg("Não foi possível abrir a câmera. Permita o acesso à câmera para este app nos ajustes.");return}
  let bd=null;try{if("BarcodeDetector" in window)bd=new BarcodeDetector({formats:["qr_code","code_128","itf","data_matrix"]})}catch(e){bd=null}
  if(!bd){try{await loadZXW()}catch(e){msg("Leitor não carregado: abra o app uma vez com internet para ele ficar disponível offline.");return}}
  msg("Aponte para o QR code ou o código de barras");
  const cv=document.createElement("canvas"),ctx=cv.getContext("2d",{willReadFrequently:true});
  const tick=async()=>{if(!run)return;
    if(v.readyState>=2&&!ui.lock&&!$(".ovl")){try{let txt=null;const W=v.videoWidth,H=v.videoHeight;
      if(bd){const r=await bd.detect(v);const h=(r||[]).find(x=>scanParse(x.rawValue))||(r||[])[0];txt=h&&h.rawValue}
      else{const sw=Math.round(W*.84),sh=Math.round(H*.5),sx=Math.round((W-sw)/2),sy=Math.round(H*.25),k=Math.min(1,1280/sw);cv.width=Math.round(sw*k);cv.height=Math.round(sh*k);ctx.drawImage(v,sx,sy,sw,sh,0,0,cv.width,cv.height);
        const rs=await window.ZXingWASM.readBarcodes(ctx.getImageData(0,0,cv.width,cv.height),{tryHarder:true,formats:["QRCode","Code128","ITF","DataMatrix"],maxNumberOfSymbols:1});const h=(rs||[]).find(x=>x.text);txt=h&&h.text}
      const t=Date.now();if(txt&&!(txt===last&&t-lastT<2500)){last=txt;lastT=t;onRead(txt)}}catch(e){}}
    setTimeout(tick,bd?120:200)};tick()}

// ---------- início ----------
(async()=>{
  try{const p=await DB.get("pacote");if(p){PAC=p;IX=buildIndex(p)}const st=await DB.get("estado");if(st)S={cargas:[],atual:null,disp:"",conf:"",...st}}catch(e){toast("Armazenamento do aparelho indisponível.")}
  devInit();
  if(navigator.storage&&navigator.storage.persist)try{navigator.storage.persist()}catch(e){}
  render();focusScan();
  if("serviceWorker" in navigator)try{await navigator.serviceWorker.register("sw.js")}catch(e){}
  try{if(navigator.wakeLock){const req=async()=>{try{await navigator.wakeLock.request("screen")}catch(e){}};req();document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")req()})}}catch(e){}
})();
</script>
